<!doctype html>
<html lang="ar" dir="rtl">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>الملف كبير — تقدر</title>
<style>
  :root { --navy:#123b3a; --ink:#173536; --muted:#607173; --bg:#f3f6f6; }
  body { margin:0; background:var(--bg); color:var(--ink);
         font-family:"Cairo",Tahoma,Arial,sans-serif;
         display:grid; place-items:center; min-height:100vh; padding:24px; }
  .box { background:#fff; border-radius:20px; padding:32px; max-width:520px;
         box-shadow:0 5px 20px #0000000f; }
  h1 { margin:0 0 12px; font-size:22px; color:var(--navy); }
  p  { margin:0 0 12px; line-height:1.8; color:var(--muted); }
  ul { margin:0 0 20px; padding-inline-start:20px; color:var(--muted); line-height:1.9; }
  a  { display:inline-block; background:var(--navy); color:#fff; text-decoration:none;
       padding:12px 22px; border-radius:10px; font-weight:700; }
</style>
<div class="box">
  <h1>الملف أكبر مما يقبله الخادم</h1>
  <p>لم يصل طلبك لأن حجم الملف تجاوز الحد المسموح، فرده الخادم قبل أن تبدأ المعالجة.</p>
  <ul>
    <li>تأكد أن الملف بالصيغة المطلوبة في الشاشة — الاستيراد يقبل CSV وحده.</li>
    <li>ابق تحت الحد المكتوب أسفل حقل الرفع.</li>
    <li>لملف كبير: قسمه إلى ملفات أصغر واستوردها تباعا.</li>
  </ul>
  <a href="/">عد إلى المنصة</a>
</div>
</html>
