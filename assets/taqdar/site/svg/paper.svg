<svg xmlns="http://www.w3.org/2000/svg" width="300" height="300" viewBox="0 0 300 300">
  <!-- Fine paper grain. baseFrequency is deliberately high so the grain stays
       sub-pixel-ish and reads as texture, never as noise. -->
  <filter id="grain" x="0" y="0" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency="0.82" numOctaves="4" seed="7"/>
    <feColorMatrix type="saturate" values="0"/>
  </filter>
  <rect width="300" height="300" filter="url(#grain)"/>
</svg>
