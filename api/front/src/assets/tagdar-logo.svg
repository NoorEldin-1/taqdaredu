<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 220" width="200" height="220" role="img" aria-labelledby="tagdarLogoTitle">
  <title id="tagdarLogoTitle">تقدر — الهوية البصرية</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Tajawal:wght@700&display=swap');
    .tagdar-word { font-family: 'Tajawal', 'Segoe UI', Tahoma, sans-serif; font-weight: 700; }
  </style>

  <!-- الرمز: قبعة تخرج تستقر على قاعدة ثابتة، وحافتها مرسومة كصفحتَي كتاب مفتوح -->
  <g fill="#0F2C4C">
    <!-- زر/عقدة القبعة أعلى العمود الفقري -->
    <circle cx="100" cy="38" r="6" />
    <!-- العمود الفقري (عمود القبعة / ثنية الكتاب) -->
    <rect x="97.5" y="43" width="5" height="53" rx="2.5" />
    <!-- الجناح الأيسر: صفحة الكتاب / حافة القبعة اليسرى -->
    <path d="M100,50 C76,40 42,46 26,72 C46,90 76,92 100,86 Z" />
    <!-- الجناح الأيمن: صفحة الكتاب / حافة القبعة اليمنى -->
    <path d="M100,50 C124,40 158,46 174,72 C154,90 124,92 100,86 Z" />
    <!-- القاعدة: الثبات الذي تستقر عليه القبعة -->
    <rect x="58" y="94" width="84" height="16" rx="8" />
  </g>

  <!-- الكلمة -->
  <text x="100" y="172" text-anchor="middle" font-size="50" fill="#0F2C4C" class="tagdar-word">تقدر</text>

  <!-- الشرارة -->
  <circle cx="100" cy="200" r="7" fill="#F29C38" />
</svg>
