<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- CSP hardened: eval disabled (bundle uses none); inline kept, required by
         the inline load handlers and framer-motion / Radix CSS-in-JS.
         NOTE: add the client's production domain to connect-src before deploy. -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://player.vimeo.com https://www.youtube.com https://www.youtube-nocookie.com https://static.cloudflareinsights.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' https: data: blob:; media-src 'self' https: blob:; connect-src 'self' https://player.vimeo.com https://*.vimeocdn.com https://cloudflareinsights.com; frame-src 'self' https://player.vimeo.com https://www.youtube.com https://www.youtube-nocookie.com https://youtube.com; object-src 'none'; base-uri 'self'; upgrade-insecure-requests" />
    <title>تقدر | منصة تعليمية تلهمك.. وتمكّنك</title>
    <meta name="description" content="منصة تعليمية رقمية تلهمك وتمكّنك. تعلّم من نخبة المدربين وطوّر مهاراتك بمسارات تعليمية مصممة لتحقيق أهدافك." />
    <meta name="author" content="تقدر" />
    <meta name="robots" content="index, follow" />
    <meta name="theme-color" content="#0F2C4C" />
    <!-- SVG first for crisp scaling; PNG fallback for browsers that ignore it. -->
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon-32.png" sizes="32x32" type="image/png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!-- Fonts loaded async (non-render-blocking) with a swap fallback.
         Tajawal is the brand face (identity PDF p.06); Inter covers Latin. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;800;900&family=Inter:wght@300;400;500;600;700;800&display=swap" onload="this.onload=null;this.rel='stylesheet'" />
    <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;800;900&family=Inter:wght@300;400;500;600;700;800&display=swap" /></noscript>

    <meta property="og:title" content="تقدر | منصة تعليمية تلهمك.. وتمكّنك" />
    <meta property="og:description" content="منصة تعليمية رقمية تلهمك وتمكّنك. تعلّم من نخبة المدربين وطوّر مهاراتك." />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="ar_AR" />
    <meta property="og:image" content="/og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="/og-image.jpg" />

    <!-- Structured data: mirrors the server-rendered SEO views (Seo.php home).
         TODO: fill `url` / `sameAs` once the client's domain + socials are set. -->
    <script type="application/ld+json">
    [{"@context":"https://schema.org","@type":"EducationalOrganization","name":"تقدر","description":"منصة تعليمية رقمية تلهمك وتمكّنك."}]
    </script>
    <script>
      if (window.location.search.indexOf('debug=1') !== -1) {
        var s = document.createElement('script');
        s.src = '/eruda.js';
        document.head.appendChild(s);
        s.onload = function () { eruda.init(); };
      }
    </script>
  </head>

  <body>
    <!-- Instant-paint branded splash. Painted at HTML-parse time (before the JS
         bundle executes) so First Contentful Paint fires in ~0.5s instead of
         ~3s. React's createRoot() replaces #root's children on mount, so this
         is wiped the moment the app renders (no hydration matching needed).
         Colours are the brand navy (#0F2C4C) + teal spinner (#00847B). -->
    <div id="root">
      <div id="app-splash" style="position:fixed;inset:0;z-index:9999;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;background:#0F2C4C;color:#fff;font-family:Tajawal,Inter,system-ui,sans-serif">
        <div style="font-size:34px;font-weight:800;letter-spacing:.4px">تقدر</div>
        <div style="font-size:13px;font-weight:400;opacity:.72">تلهمك.. وتمكّنك</div>
        <div style="width:38px;height:38px;border:3px solid rgba(255,255,255,.18);border-top-color:#00847B;border-radius:50%;animation:appspin 1s linear infinite"></div>
      </div>
    </div>
    <style>@keyframes appspin{to{transform:rotate(360deg)}}</style>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
