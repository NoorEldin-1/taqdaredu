<?xml version="1.0" encoding="UTF-8"?>
<!--
  تقدر — الرمز وحده (بدون الكلمة).

  نسخة مقصوصة من src/assets/tagdar-logo.svg لاستخدامها في شريط لوحة التحكم:
  الشعار الكامل رأسي (200×220) فلو صُغّر إلى ارتفاع 40 بكسل تصبح الكلمة
  بارتفاع ٩ بكسل — غير مقروءة. الرمز وحده يظل واضحاً في هذا الحجم، والكلمة
  تُكتب بجانبه كنص HTML بخط Tajawal في header.php.

  يبقى اللون كحلياً لأن نفس الملف يظهر على خلفية فاتحة في صفحة الإعدادات؛
  شريط اللوحة الكحلي يقلبه إلى الأبيض عبر filter في tagdar.css.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="20 26 160 92" role="img" aria-labelledby="t">
  <title id="t">تقدر</title>
  <g fill="#0F2C4C">
    <!-- زر/عقدة القبعة أعلى العمود الفقري -->
    <circle cx="100" cy="38" r="6" />
    <!-- العمود الفقري (عمود القبعة / ثنية الكتاب) -->
    <rect x="97.5" y="43" width="5" height="53" rx="2.5" />
    <!-- الجناح الأيسر: صفحة الكتاب / حافة القبعة اليسرى -->
    <path d="M100,50 C76,40 42,46 26,72 C46,90 76,92 100,86 Z" />
    <!-- الجناح الأيمن: صفحة الكتاب / حافة القبعة اليمنى -->
    <path d="M100,50 C124,40 158,46 174,72 C154,90 124,92 100,86 Z" />
    <!-- القاعدة: الثبات الذي تستقر عليه القبعة -->
    <rect x="58" y="94" width="84" height="16" rx="8" />
  </g>
</svg>
